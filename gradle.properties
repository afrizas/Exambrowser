org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# =====================================================================
# KONFIGURASI APLIKASI (boleh diubah oleh administrator sekolah)
# Cukup edit nilai di bawah ini, tidak perlu mengubah kode Kotlin.
# Jangan memakai tanda kutip (") atau garis miring terbalik (\) pada nilai.
# =====================================================================

# Alamat portal CBT yang langsung dibuka saat aplikasi dijalankan.
cbt.portalUrl=https://cbt.smkn14kabupatentangerang.sch.id/

# Identitas aplikasi yang dikirim ke server sekolah (hanya ke host portal).
# Server memakai ini untuk mengenali "aplikasi resmi CBT SMKN 14".
# Nilai bawaan sama dengan yang dipakai APK lama (ujian.apk, v3.1).
# Kosongkan cbt.appHeaderName bila server tidak memakai header ini.
cbt.appHeaderName=X-CBT-SMKN14-App
cbt.appHeaderValue=SMKN14-Verified

# Token yang ditambahkan di akhir User-Agent WebView pada SEMUA permintaan.
# Kosongkan bila tidak diperlukan.
cbt.appUaToken=CBT-SMKN14-Exambro/0.2.2
